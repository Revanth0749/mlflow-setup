name: terraform-destroy   # fixed typo (was terraform-destory)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-staging" to confirm'
        required: true
        type: string
      layers:
        description: 'Which layers to destroy'
        required: true
        type: choice
        default: 'all'
        options:
          - all-except-foundation
          - all
          - 20-identity
          - 10-data
          - 07-eks
          - 05-network
          - 00-foundation

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: staging        
    if: ${{ inputs.confirm == 'destroy-staging' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::840432317544:role/github-actions-deploy-role
          role-session-name: tf-destroy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
          terraform_wrapper: false

      - name: Decide layers (reverse dependency order)
        id: layers
        env:
          LAYERS_INPUT: ${{ inputs.layers }}
        run: |
          case "$LAYERS_INPUT" in
            all)                    L="20-identity 10-data 07-eks 05-network 00-foundation" ;;
            all-except-foundation)  L="20-identity 10-data 07-eks 05-network" ;;
            *)                      L="$LAYERS_INPUT" ;;
          esac
          echo "list=$L" >> "$GITHUB_OUTPUT"
          echo "Will destroy: $L"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MODULES_DEPLOY_KEY }}

      - name: Destroy
        env:
          LAYER_LIST: ${{ steps.layers.outputs.list }}
        run: |
          set -euo pipefail
          for layer in $LAYER_LIST; do
            echo "::group::destroy $layer"
            cd "terraform/envs/staging/$layer"
            terraform init
