name: terraform-plan

on:
  workflow_dispatch: 

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  TF_IN_AUTOMATION: true

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: stagig-plan
    strategy:
      fail-fast: false
      matrix:
        layer: [00-foundation, 05-network, 07-eks, 10-data, 20-identity]
    defaults:
      run:
        working-directory: terraform/envs/staging/${{ matrix.layer }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::840432317544:role/github-actions-deploy-role
          role-session-name: tf-plan-${{ matrix.layer }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform-version: 1.10.0
          terraform-wrapper: false

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MODULES_DEPLOY_KEY }}

      - name: Format Check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color -lock-timeout=60s | tee plan.txt

      - name: Comment plan on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'terraform/envs/staging/${{ matrix.layer }}/plan.txt';
            const plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No Plan output.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Plan: ${{ matrix.layer }}\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\``
            });

      - name: Add plan to job summary
        if: always()
        run: |
          echo '### Plan: ${{ matrix.layer }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -c 60000 plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
