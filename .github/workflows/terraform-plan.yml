name: terraform-plan

on:
  pull_request:
    paths: ["terraform/**"]
  workflow_dispatch: 

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  TF_IN_AUTOMATION: true

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: stagig-plan
    strategy:
      fail-fast: false
      matrix:
        layer: [oo-foundation, 05-network, 07-eks, 10-data, 20-identity]
    defaults:
      run:
        working-directory: terraform/envs/staging/${{ matrix.layer }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform-version: 1.10.0
          terraform-wrapper: false

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MODULES_DEPLOY_KEY }}

      - name: Format Check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color -lock-timeout=60s | tee plan.txt

      - name: Comment plan on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'terraform/envs/staging/${{ matrix.layer }}/plan.txt';
            const plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No Plan output.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Plan: ${{ matrix.layer }}\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\``
            });
