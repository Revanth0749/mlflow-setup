name: terraform-apply

on:
    push:
        branches: [main]
        paths: ["terraform/**"]

permissions:
    id-token: write
    contents: read

concurrency:
    group: terraform-apply
    cancel-in-progress: false

env:
    AWS_REGION: ap-southeast-2
    AWS_DEFAULT_REGION: ap-southeast-2
    TF_IN_AUTOMATION: "true"

jobs:
    apply:
        runs-on: ubuntu-latest
        environment: staging

        steps:
            - uses: actions/checkout@v4

            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/github-actions-terraform-apply-staging
                role-session-name: tf-apply-${{ github.run_id }}
                aws-region: ${{ env.AWS_REGION }}
                role-duration-seconds: 3600

            - uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: 1.10.0
                terraform_wrapper: false

            - uses: webfactory/ssh-agent@v0.9.0
              with:
                ssh-private-key: ${{ secrets.MODULES_DEPLOY_KEY }}

            - name: Apply layers in dependency order
              run: |
                set -euo pipefail
                for layer in 00-foundation 05-network 07-eks 10-data 20-identity; do
                  echo "::group::$layer"
                  cd "terraform/envs/staging/$layer"
                  terraform init -input=false
                  terraform plan -input=false -out=tfplan
                  terraform apply -input=false tfplan
                  cd "$GITHUB_WORKSPACE"
                  echo "::endgroup::"
                done