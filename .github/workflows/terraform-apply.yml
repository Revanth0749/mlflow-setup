name: terraform-apply

on:
    push:
        branches: [main]
        paths: ["terraform/**"]

permissions:
    contents: read

concurrency:
    group: terraform-appy
    cancel-in-progress: false

env:
    AWS_REGION: ap-southeast-2
    AWS_DEFAULT_REGION: ap-southeast-2
    TF_IN_AUTOMATION: "true"

jobs:
    apply:
        runs-on: ubuntu-latest
        environment: staging
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS__KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        steps:
            -  uses: actions/checkout@v4

            - uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: 1.10.0
                terraform_wrapper: false

            - uses: webfactory/ssh-agent@v0.9.0
              with:
                ssh-private-key: ${{ secrets.MODULES_DEPLOY_KEY}}

            - name: Apply layers in dependency order
              run: |
                set -euo pipefail
                for layer in 00-foundation 05-network 07-eks 10-data 20-identity; do
                  echo "::group::$layer"
                  cd "terraform/envs/staging/$layer"
                  terraform init -input=false
                  terraform plan -input=false -out=tfplan
                  terraform apply -input=false tfplan
                  cd "$GITHUB_WORKSPACE"
                  echo "::endgroup::"
                done
